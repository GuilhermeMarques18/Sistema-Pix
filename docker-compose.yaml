services:
  postgres:
    image: postgres:16-alpine
    container_name: sistem-pix-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: sistem_pix
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d sistem_pix"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sistem-pix-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistem-pix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    networks:
      - sistem-pix-net

volumes:
  postgres_data:

networks:
  sistem-pix-net:
    driver: bridge
