spring.application.name=sistem-pix

# Load local development values from .env when it exists. In production, provide
# these same properties as regular environment variables or external config.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
server.port=3000
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-hours=2
